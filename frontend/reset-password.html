<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music - Reset Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper">
            <h1>My Music</h1>
            <p class="auth-subtitle">Set a New Password</p>

            <form id="resetForm" class="auth-form" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn-primary">Reset Password</button>
            </form>

            <div class="auth-message" id="resetMessage"></div>

            <div id="resetSuccess" style="display: none; text-align: center;">
                <h2 style="color: #1db954; font-size: 1.5em; margin-bottom: 20px;">✓ Password Reset!</h2>
                <p style="color: #b3b3b3; margin-bottom: 15px;">Your password has been changed successfully.</p>
                <p style="color: #fff; margin-bottom: 20px;">Redirecting to login page...</p>
                <div style="background: #282828; padding: 15px; border-radius: 6px; color: #1db954; font-weight: 600;" id="countdownText">Redirecting in 3 seconds...</div>
            </div>

            <div class="auth-footer">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        async function handleResetPassword(event) {
            event.preventDefault();

            const token = getTokenFromUrl();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('resetMessage');

            if (!token) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Invalid reset link. No token found.';
                return;
            }

            if (newPassword.length < 6) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Passwords do not match';
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('resetForm').style.display = 'none';
                    document.querySelector('.auth-footer').style.display = 'none';
                    document.getElementById('resetSuccess').style.display = 'block';
                    messageDiv.style.display = 'none';

                    let countdown = 3;
                    const countdownInterval = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            document.getElementById('countdownText').textContent = 'Redirecting in ' + countdown + ' seconds...';
                        } else {
                            clearInterval(countdownInterval);
                            window.location.href = 'login.html';
                        }
                    }, 1000);
                } else {
                    messageDiv.className = 'auth-message error';
                    messageDiv.textContent = data.message || 'Password reset failed';
                }
            } catch (error) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = '❌ Connection error. Make sure the backend server is running.';
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
