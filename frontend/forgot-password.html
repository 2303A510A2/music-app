<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music - Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper">
            <h1>My Music</h1>
            <p class="auth-subtitle">Reset Your Password</p>

            <div class="step-indicators">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
            </div>

            <!-- Step 1: Enter Email -->
            <div class="step active" id="step1">
                <form id="emailForm" class="auth-form" onsubmit="handleGetQuestions(event)">
                    <div class="form-group">
                        <label for="forgotEmail">Registered Email</label>
                        <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
                    </div>
                    <button type="submit" class="btn-primary" id="getQuestionsBtn">Continue</button>
                </form>
                <div class="auth-message" id="step1Message"></div>
            </div>

            <!-- Step 2: Answer Security Questions -->
            <div class="step" id="step2">
                <p style="color: #b3b3b3; font-size: 0.9em; text-align: center; margin-bottom: 15px;">Answer your security questions for</p>
                <p style="color: #fff; font-size: 0.95em; text-align: center; font-weight: 600; margin-bottom: 20px;" id="displayEmail"></p>
                <form id="securityForm" class="auth-form" onsubmit="handleVerifySecurity(event)">
                    <div class="form-group">
                        <label for="securityAnswer1">What is your pet's name?</label>
                        <input type="text" id="securityAnswer1" placeholder="Enter your pet's name" required>
                    </div>
                    <div class="form-group">
                        <label for="securityAnswer2">What is your favorite color?</label>
                        <input type="text" id="securityAnswer2" placeholder="Enter your favorite color" required>
                    </div>
                    <button type="submit" class="btn-primary" id="verifySecurityBtn">Verify Answers</button>
                </form>
                <div class="auth-message" id="step2Message"></div>
            </div>

            <!-- Step 3: New Password -->
            <div class="step" id="step3">
                <form id="resetForm" class="auth-form" onsubmit="handleResetPassword(event)">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required minlength="6" oninput="updatePasswordStrength()">
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    <button type="submit" class="btn-primary">Reset Password</button>
                </form>
                <div class="auth-message" id="step3Message"></div>
            </div>

            <!-- Success -->
            <div id="forgotSuccess" style="display: none; text-align: center;">
                <h2 style="color: #1db954; font-size: 1.5em; margin-bottom: 20px;">✓ Password Reset Successful!</h2>
                <p style="color: #b3b3b3; margin-bottom: 15px;">Your password has been changed successfully.</p>
                <p style="color: #fff; margin-bottom: 20px;">You can now log in with your new password.</p>
                <a href="login.html" style="display: inline-block; background: #1db954; color: #000; text-decoration: none; padding: 14px 32px; border-radius: 24px; font-weight: 600; font-size: 16px; margin-top: 10px;">Go to Login</a>
            </div>

            <div class="auth-footer">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        let verifiedEmail = '';
        let resetToken = '';

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
            document.querySelectorAll('.step-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === stepNum);
                dot.classList.toggle('done', i + 1 < stepNum);
            });
        }

        async function handleGetQuestions(event) {
            event.preventDefault();

            const email = document.getElementById('forgotEmail').value;
            const messageDiv = document.getElementById('step1Message');
            const btn = document.getElementById('getQuestionsBtn');

            btn.disabled = true;
            btn.textContent = 'Checking...';
            messageDiv.className = 'auth-message';
            messageDiv.textContent = '';

            try {
                const response = await fetch('/api/auth/get-security-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    verifiedEmail = email;
                    document.getElementById('displayEmail').textContent = email;
                    document.getElementById('securityAnswer1').value = '';
                    document.getElementById('securityAnswer2').value = '';
                    document.getElementById('step2Message').className = 'auth-message';
                    document.getElementById('step2Message').textContent = '';
                    showStep(2);
                    messageDiv.className = 'auth-message';
                    messageDiv.textContent = '';
                } else {
                    messageDiv.className = 'auth-message error';
                    messageDiv.textContent = data.message || 'Email not found';
                }
            } catch (error) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Connection error. Make sure the backend is running.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Continue';
            }
        }

        async function handleVerifySecurity(event) {
            event.preventDefault();

            const petName = document.getElementById('securityAnswer1').value;
            const favoriteColor = document.getElementById('securityAnswer2').value;
            const messageDiv = document.getElementById('step2Message');
            const btn = document.getElementById('verifySecurityBtn');

            if (!petName || !favoriteColor) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Please answer both security questions';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            messageDiv.className = 'auth-message';
            messageDiv.textContent = '';

            try {
                const response = await fetch('/api/auth/verify-security', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verifiedEmail, petName, favoriteColor })
                });

                const data = await response.json();

                if (response.ok) {
                    resetToken = data.token;
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    document.getElementById('passwordStrength').className = 'password-strength';
                    document.getElementById('step3Message').className = 'auth-message';
                    document.getElementById('step3Message').textContent = '';
                    showStep(3);
                } else {
                    messageDiv.className = 'auth-message error';
                    messageDiv.textContent = data.message || 'Security answers do not match';
                }
            } catch (error) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Connection error. Make sure the backend is running.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify Answers';
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('step3Message');
            const btn = document.querySelector('#step3 .btn-primary');

            if (newPassword.length < 6) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Passwords do not match';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';
            messageDiv.className = 'auth-message';
            messageDiv.textContent = '';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, newPassword, confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('resetForm').style.display = 'none';
                    document.getElementById('step3').style.display = 'none';
                    document.querySelector('.step-indicators').style.display = 'none';
                    document.querySelector('.auth-footer').style.display = 'none';
                    document.getElementById('forgotSuccess').style.display = 'block';
                } else {
                    messageDiv.className = 'auth-message error';
                    messageDiv.textContent = data.message || 'Password reset failed';
                }
            } catch (error) {
                messageDiv.className = 'auth-message error';
                messageDiv.textContent = 'Connection error. Make sure the backend is running.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }

        function updatePasswordStrength() {
            const val = document.getElementById('newPassword').value;
            const bar = document.getElementById('passwordStrength');
            bar.className = 'password-strength';
            if (val.length >= 6) {
                if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) {
                    bar.classList.add('strong');
                } else if (val.length >= 8) {
                    bar.classList.add('medium');
                } else {
                    bar.classList.add('weak');
                }
            }
        }
    </script>
</body>
</html>
